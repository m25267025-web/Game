<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Dungeon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            background-color: #111;
            color: #0f0;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
            user-select: none;
            touch-action: manipulation;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 4px solid #0f0;
            padding: 15px;
            background: #000;
            box-shadow: 0 0 15px #0f0;
        }
        h1 {
            font-size: 16px;
            color: #fff;
            text-shadow: 2px 2px #f00;
            margin-bottom: 20px;
        }
        .hp-bar {
            width: 100%;
            height: 20px;
            border: 2px solid #fff;
            margin: 10px 0;
            background: #333;
            position: relative;
        }
        .hp-fill {
            height: 100%;
            background: #f00;
            width: 100%;
            transition: width 0.3s;
        }
        .stats {
            font-size: 10px;
            margin: 15px 0;
            line-height: 1.8;
        }
        button {
            font-family: 'Press Start 2P', monospace;
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 15px 20px;
            margin: 10px 0;
            width: 100%;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.1s;
        }
        button:active {
            background: #0f0;
            color: #000;
            transform: scale(0.95);
        }
        #log {
            font-size: 10px;
            color: #aaa;
            height: 80px;
            overflow-y: auto;
            margin-top: 15px;
            text-align: left;
            border-top: 1px dashed #555;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ PIXEL DUNGEON ⚔️</h1>
        
        <div class="stats">
            Уровень: <span id="lvl">1</span><br>
            Урон: <span id="dmg">10</span><br>
            Монеты: <span id="gold">0</span>
        </div>

        <div class="hp-bar">
            <div class="hp-fill" id="hp-fill" style="width: 100%;"></div>
        </div>
        <div style="font-size: 10px; margin-bottom: 10px;">HP: <span id="hp-text">100/100</span></div>

        <div id="log">Нажми "В бой", чтобы начать...</div>

        <div id="actions">
            <button onclick="startBattle()">⚔️ В БОЙ</button>
        </div>
        
        <div id="battle-actions" style="display: none;">
            <button onclick="attack()">⚔️ АТАКА</button>
            <button onclick="heal()">🧪 ЗЕЛЬЕ</button>
        </div>
    </div>

    <script>
        // Игровые переменные
        let player = {
            lvl: 1, dmg: 10, gold: 0,
            hp: 100, maxHp: 100
        };
        let enemy = { hp: 0, maxHp: 0, dmg: 0 };
        let inBattle = false;

        const logEl = document.getElementById('log');

        function updateUI() {
            document.getElementById('lvl').innerText = player.lvl;
            document.getElementById('dmg').innerText = player.dmg;
            document.getElementById('gold').innerText = player.gold;
            
            let hpPercent = (player.hp / player.maxHp) * 100;
            document.getElementById('hp-fill').style.width = hpPercent + '%';
            document.getElementById('hp-text').innerText = player.hp + '/' + player.maxHp;
            
            // Меняем цвет, если мало HP
            if (hpPercent < 30) {
                document.getElementById('hp-fill').style.background = '#f00';
            } else {
                document.getElementById('hp-fill').style.background = '#0f0';
            }
        }

        function addLog(text) {
            logEl.innerHTML = text + '<br>' + logEl.innerHTML;
            if (logEl.innerHTML.length > 500) logEl.innerHTML = logEl.innerHTML.substring(0, 500);
        }

        function startBattle() {
            inBattle = true;
            enemy.maxHp = 50 + (player.lvl * 20);
            enemy.hp = enemy.maxHp;
            enemy.dmg = 5 + (player.lvl * 2);
            
            document.getElementById('actions').style.display = 'none';
            document.getElementById('battle-actions').style.display = 'block';
            addLog(`Появился враг! HP: ${enemy.hp}`);
            updateUI();
        }

        function attack() {
            if (!inBattle) return;
            
            // Игрок бьет
            let crit = Math.random() < 0.2;
            let dmg = player.dmg * (crit ? 3 : 1);
            enemy.hp -= dmg;
            addLog(`Ты ударил на ${dmg} ${crit ? '(КРИТ!)' : ''}`);

            if (enemy.hp <= 0) {
                // Победа
                let reward = 20 * player.lvl;
                player.gold += reward;
                addLog(`Враг убит! +${reward} монет.`);
                inBattle = false;
                document.getElementById('actions').style.display = 'block';
                document.getElementById('battle-actions').style.display = 'none';
                
                // Прокачка
                if (player.gold >= player.lvl * 50) {
                    player.lvl++;
                    player.dmg += 5;
                    player.maxHp += 20;
                    player.hp = player.maxHp;
                    addLog(`🏆 УРОВЕНЬ ПОВЫШЕН! Теперь урон ${player.dmg}`);
                }
            } else {
                // Враг бьет
                player.hp -= enemy.dmg;
                addLog(`Враг ударил на ${enemy.dmg}`);
                if (player.hp <= 0) {
                    player.hp = 1;
                    player.gold = Math.max(0, player.gold - 20);
                    inBattle = false;
                    addLog(`💀 Ты проиграл! Потерял 20 монет.`);
                    document.getElementById('actions').style.display = 'block';
                    document.getElementById('battle-actions').style.display = 'none';
                }
            }
            updateUI();
        }

        function heal() {
            if (player.gold >= 30) {
                player.gold -= 30;
                player.hp = Math.min(player.maxHp, player.hp + 50);
                addLog(`🧪 Выпил зелье (+50 HP). -30 монет.`);
                updateUI();
            } else {
                addLog(`❌ Не хватает монет на зелье (нужно 30).`);
            }
        }

        // Инициализация Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        
        updateUI();
    </script>
</body>
</html>
