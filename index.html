<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dungeon Knight</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            background-color: #0a0a0a; color: #fff;
            font-family: 'Press Start 2P', monospace;
            margin: 0; padding: 10px; height: 100vh; width: 100vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box; overflow: hidden; user-select: none;
        }
        .game-container {
            width: 100%; max-width: 380px;
            border: 4px solid #555; background: #111; padding: 10px;
            border-radius: 8px;
        }
        .hud {
            display: flex; justify-content: space-between;
            font-size: 10px; color: #ffcc00; margin-bottom: 10px;
        }
        .enemy-area {
            height: 120px; border: 2px solid #333; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 10px; position: relative;
        }
        .enemy-sprite { font-size: 40px; margin-bottom: 5px; }
        .hp-bar { width: 80%; height: 10px; border: 1px solid #fff; background: #333; }
        .hp-fill { height: 100%; background: #ff0000; width: 100%; }
        
        .stats { font-size: 8px; color: #fff; line-height: 1.8; margin-bottom: 10px; }
        .energy-bar { width: 100%; height: 8px; border: 1px solid #00ffcc; background: #333; margin-top: 2px;}
        .energy-fill { height: 100%; background: #00ffcc; width: 100%; transition: width 0.2s;}
        
        .log { font-size: 8px; color: #aaa; height: 30px; text-align: center; margin-bottom: 10px; }

        button {
            font-family: 'Press Start 2P', monospace;
            background: #222; color: #fff; border: 2px solid #777;
            padding: 10px; width: 100%; margin-bottom: 5px;
            font-size: 10px; cursor: pointer;
        }
        button:active { background: #555; transform: scale(0.98); }
        button:disabled { color: #555; border-color: #333; background: #111; }
        
        .btn-rest { background: #003300; border-color: #00ff00; }
        .btn-boss { background: #330000; border-color: #ff0000; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div>Этаж: <span id="floor">1</span></div>
            <div>Сложность: <span id="diff">1</span></div>
        </div>

        <div class="enemy-area">
            <div class="enemy-sprite" id="enemy-img">👹</div>
            <div style="font-size:8px; margin-bottom:2px;" id="enemy-name">Гоблин</div>
            <div class="hp-bar"><div class="hp-fill" id="e-hp-fill"></div></div>
        </div>

        <div class="stats">
            ❤️ HP: <span id="hp">100</span>/<span id="max-hp">100</span><br>
            ⚡ Энергия: <span id="energy">100</span>/100<br>
            <div class="energy-bar"><div class="energy-fill" id="e-energy-fill"></div></div>
            ⚔️ Урон: <span id="dmg">10</span> | 🪙 Монеты: <span id="gold">0</span>
        </div>

        <div class="log" id="log">Ты вошел в подземелье...</div>

        <button id="btn-attack" onclick="attack()">⚔️ АТАКА (-10 ⚡)</button>
        <button id="btn-rest" class="btn-rest" onclick="rest()">🛌 ОТДОХНУТЬ (+30 ⚡, враг бьет)</button>
        <button id="btn-next" class="btn-boss" style="display:none;" onclick="nextFloor()">🚪 СПУСТИТЬСЯ НИЖЕ</button>
    </div>

    <script>
        let game = {
            floor: 1,
            diff: 1,
            kills: 0,
            hp: 100, maxHp: 100,
            energy: 100,
            dmg: 10, gold: 0
        };

        let enemy = { name: '', hp: 0, maxHp: 0, dmg: 0, icon: '' };

        const enemyTypes = [
            { name: 'Гоблин', icon: '👹', hp: 30, dmg: 5 },
            { name: 'Скелет', icon: '💀', hp: 40, dmg: 8 },
            { name: 'Слизь', icon: '🟢', hp: 20, dmg: 3 },
            { name: 'Летучая мышь', icon: '🦇', hp: 25, dmg: 6 }
        ];

        function updateUI() {
            document.getElementById('floor').innerText = game.floor;
            document.getElementById('diff').innerText = game.diff;
            document.getElementById('hp').innerText = game.hp;
            document.getElementById('max-hp').innerText = game.maxHp;
            document.getElementById('energy').innerText = game.energy;
            document.getElementById('dmg').innerText = game.dmg;
            document.getElementById('gold').innerText = game.gold;
            
            document.getElementById('e-energy-fill').style.width = Math.max(0, game.energy) + '%';
            document.getElementById('e-hp-fill').style.width = (enemy.hp / enemy.maxHp * 100) + '%';

            // Проверка на усталость
            if (game.energy < 15) {
                document.getElementById('btn-attack').disabled = true;
                document.getElementById('log').innerText = "Ты слишком устал! Отдохни.";
            } else {
                document.getElementById('btn-attack').disabled = false;
            }
        }

        function spawnEnemy() {
            let template = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            enemy.name = template.name;
            enemy.icon = template.icon;
            enemy.maxHp = template.hp + (game.diff * 10);
            enemy.hp = enemy.maxHp;
            enemy.dmg = template.dmg + (game.diff * 2);

            document.getElementById('enemy-img').innerText = enemy.icon;
            document.getElementById('enemy-name').innerText = enemy.name;
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-attack').style.display = 'block';
            document.getElementById('btn-rest').style.display = 'block';
            document.getElementById('log').innerText = `Появился ${enemy.name}!`;
            updateUI();
        }

        function attack() {
            if (game.energy < 10) return;
            
            // Игрок бьет
            game.energy -= 10;
            let crit = Math.random() < 0.2;
            let damage = game.dmg * (crit ? 3 : 1);
            enemy.hp -= damage;
            
            let logText = `Ты ударил на ${damage} ${crit ? '(КРИТ!)' : ''}. `;
            document.getElementById('log').innerText = logText;

            if (enemy.hp <= 0) {
                // Победа
                game.kills++;
                let reward = 10 + (game.diff * 5);
                game.gold += reward;
                document.getElementById('log').innerText = `Враг убит! +${reward} монет. (${game.kills}/5)`;
                
                if (game.kills >= 5) {
                    // Этаж пройден
                    document.getElementById('btn-attack').style.display = 'none';
                    document.getElementById('btn-rest').style.display = 'none';
                    document.getElementById('btn-next').style.display = 'block';
                    document.getElementById('log').innerText = "Этаж зачищен! Найди люк и спускайся.";
                } else {
                    setTimeout(spawnEnemy, 1000);
                }
            } else {
                // Враг бьет в ответ
                game.hp -= enemy.dmg;
                document.getElementById('log').innerText += ` Враг ударил на ${enemy.dmg}.`;
                
                if (game.hp <= 0) {
                    gameOver();
                }
            }
            updateUI();
        }

        function rest() {
            game.energy = Math.min(100, game.energy + 30);
            game.hp -= enemy.dmg;
            document.getElementById('log').innerText = `Ты отдохнул (+30 ⚡). Но ${enemy.name} ударил тебя на ${enemy.dmg}.`;
            
            if (game.hp <= 0) {
                gameOver();
            }
            updateUI();
        }

        function nextFloor() {
            game.floor++;
            game.diff = game.floor; // Сложность растет с этажом
            game.kills = 0;
            
            // Бонус за этаж (Лут)
            let lootType = Math.floor(Math.random() * 3);
            let lootText = "";
            
            if (lootType === 0) {
                game.dmg += 2;
                lootText = "🗡 Ты нашел Меч! +2 Урона.";
            } else if (lootType === 1) {
                game.maxHp += 10;
                game.hp = game.maxHp;
                lootText = "🛡 Ты нашел Броню! +10 Макс. HP.";
            } else {
                game.energy = 100;
                lootText = "🎒 Ты нашел Рюкзак! Энергия восстановлена.";
            }
            
            game.hp += 10; // Немного лечимся
            if (game.hp > game.maxHp) game.hp = game.maxHp;
            
            document.getElementById('log').innerText = `Ты спустился на Этаж ${game.floor}.\n${lootText}`;
            spawnEnemy();
        }

        function gameOver() {
            game.hp = game.maxHp;
            game.energy = 100;
            game.floor = 1;
            game.diff = 1;
            game.kills = 0;
            game.gold = 0;
            game.dmg = 10;
            game.maxHp = 100;
            document.getElementById('log').innerText = "💀 Ты умер! Начинаем заново.";
            spawnEnemy();
        }

        // Запуск
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        spawnEnemy();
    </script>
</body>
</html>
